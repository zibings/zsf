services:
  db:
    image: postgres
    container_name: ${PROJECT_NAME}-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: P@55word
      POSTGRES_DB: zsf
    volumes:
      - ./init-scripts/pgsql-init.sql:/docker-entrypoint-initdb.d/pgsql-init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 15s
      timeout: 5s
      retries: 5